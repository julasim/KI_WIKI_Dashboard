services:
  dashboard:
    build: .
    container_name: ki-wiki-dashboard
    restart: unless-stopped
    ports:
      # Projekt-Konvention: alle Ports in 5xxx-Range.
      # Container-intern auf 5000 (PORT env), Host exposed 5001.
      - "5001:5000"
    volumes:
      # Vault read-only — Dashboard schreibt nichts.
      - /opt/vault/KI_WIKI_Vault:/vault:ro
    environment:
      - VAULT_PATH=/vault
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=5000
      - HOSTNAME=0.0.0.0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
